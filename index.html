<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Neon Clock + Timer + Alarm</title>

<style>
  body { background:#000; color:#0ff; text-align:center; padding:40px; font-family:"Noto Sans JP"; }
  .title { font-size:48px; text-shadow:0 0 20px #0ff; }
  .neon-box { border:2px solid #0ff; padding:20px; margin:20px auto; width:300px;
    border-radius:10px; box-shadow:0 0 10px #0ff, 0 0 20px #0ff; }
  #clock { font-size:50px; font-weight:bold; text-shadow:0 0 10px #0ff, 0 0 20px #0ff; }
  button { background:transparent; border:1px solid #0ff; color:#0ff; padding:8px 20px; margin:5px;
    border-radius:5px; cursor:pointer; text-shadow:0 0 10px #0ff; }
  button:hover { box-shadow:0 0 10px #0ff; }
</style>
</head>

<body>

<h1 class="title">Neon Clock System</h1>

<div id="clock" class="neon-box"></div>

<div class="neon-box">
  <h2>Timer</h2>
  <input type="number" id="timerInput" placeholder="秒数を入力">
  <button onclick="startTimer()">Start</button>
  <button onclick="stopTimer()">Stop</button>
  <div id="timerDisplay">00:00</div>
</div>

<div class="neon-box">
  <h2>Alarm</h2>
  <input type="time" id="alarmTime">
  <button onclick="setAlarm()">Set Alarm</button>
  <div id="alarmStatus"></div>
</div>

<!-- 🔊 アラーム音 -->
<audio id="alarmSound" src="alarm.mp3" preload="auto"></audio>

<script>
/* 時計 */
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  const s = String(now.getSeconds()).padStart(2,"0");
  document.getElementById("clock").textContent = `${h}:${m}:${s}`;
}
setInterval(updateClock,1000);
updateClock();

/* タイマー */
let timerInterval;
let timerRemaining = 0;

function startTimer() {
  const input = document.getElementById("timerInput").value;
  if (!input || input <= 0) return;

  timerRemaining = input;
  clearInterval(timerInterval);

  timerInterval = setInterval(() => {
    timerRemaining--;
    const min = String(Math.floor(timerRemaining / 60)).padStart(2,"0");
    const sec = String(timerRemaining % 60).padStart(2,"0");
    document.getElementById("timerDisplay").textContent = `${min}:${sec}`;

    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      alert("Timer Finished!");
    }
  },1000);
}

function stopTimer() {
  clearInterval(timerInterval);
}

/* アラーム */
let alarmTime = null;

function setAlarm() {
  alarmTime = document.getElementById("alarmTime").value;
  document.getElementById("alarmStatus").textContent =
    alarmTime ? `アラーム設定: ${alarmTime}` : "アラーム未設定";
}

setInterval(() => {
  if (!alarmTime) return;

  const now = new Date();
  const current = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;

  if (current === alarmTime) {
    document.getElementById("alarmSound").play();  // 🔊 ここで音が鳴る
    alert("Alarm!");
    alarmTime = null;
    document.getElementById("alarmStatus").textContent = "アラーム未設定";
  }
},1000);
</script>

</body>
</html>
